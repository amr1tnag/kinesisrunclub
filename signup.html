<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account - Kinesis Run Club</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="icon" href="assets/kinesis_logo.png" />
    <meta name="theme-color" content="#2427CA" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html" aria-label="Kinesis Run Club home">
          <img src="assets/kinesis_logo.png" alt="" />
          <span>Kinesis Run Club</span>
        </a>
        <button
          class="hamburger"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-controls="navLinks"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="navlinks" id="navLinks">
          <button class="close-btn" type="button" data-menu-toggle aria-label="Close menu">
            &times;
          </button>
          <a href="index.html">Home</a>
          <a href="register_run.html">Upcoming Run</a>
          <a
            href="https://www.instagram.com/kinesisrunclub/"
            target="_blank"
            rel="noopener"
            >Instagram</a
          >
          <a href="login.html">Login</a>
          <a href="signup.html" class="btn">Join</a>
        </div>
      </div>
    </nav>
    <div class="overlay" data-menu-toggle></div>

    <main>
      <section class="section">
        <div class="container" style="max-width: 640px">
          <div class="card">
            <h1 class="section-heading">Create account</h1>
            <p class="notice" data-form-notice>
              Your account has been created for this browser session.
            </p>
            <form
              data-demo-form
              data-success="Your account has been created for this browser session."
            >
              <div class="form-row">
                <div class="field">
                  <label for="full_name">Full name</label>
                  <input id="full_name" name="full_name" autocomplete="name" required />
                </div>
                <div class="field">
                  <label for="phone">Phone number</label>
                  <input id="phone" name="phone" autocomplete="tel" required />
                </div>
              </div>
              <div class="field">
                <label for="signup_email">Email</label>
                <input
                  id="signup_email"
                  type="email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="field">
                <label for="signup_password">Password</label>
                <input
                  id="signup_password"
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />
              </div>
              <div class="actions">
                <button class="btn" type="submit">Create account</button>
                <a class="btn ghost" href="login.html">I already have one</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>&copy; 2026 Kinesis Run Club - Navi Mumbai</div>
        <div class="footer-actions">
          <a class="btn ghost" href="login.html">Login</a>
          <a class="btn" href="register_run.html">Upcoming Run</a>
        </div>
      </div>
    </footer>

    <script src="assets/site.js"></script>
  </body>
</html>
