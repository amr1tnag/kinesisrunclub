<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard - Kinesis</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="icon" href="../assets/kinesis_logo.png" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="../index.html">
          <img src="../assets/kinesis_logo.png" alt="" />
          <span>Kinesis Admin</span>
        </a>
        <button
          class="hamburger"
          type="button"
          data-menu-toggle
          aria-label="Open menu"
          aria-controls="navLinks"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="navlinks" id="navLinks">
          <button class="close-btn" type="button" data-menu-toggle aria-label="Close menu">
            &times;
          </button>
          <a href="dashboard.html">Dashboard</a>
          <a class="btn" href="login.html">Logout</a>
        </div>
      </div>
    </nav>
    <div class="overlay" data-menu-toggle></div>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-heading">Overview</h1>
          <div class="stats">
            <div class="stat">
              <div class="stat-value" data-total-registrations>0</div>
              <div class="muted">Total registrations</div>
            </div>
            <div class="stat">
              <div class="stat-value" data-five-k-count>0</div>
              <div class="muted">5KM runners</div>
            </div>
            <div class="stat">
              <div class="stat-value" data-first-time-count>0</div>
              <div class="muted">First-time runners</div>
            </div>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 16px;
              flex-wrap: wrap;
              margin-top: 34px;
            "
          >
            <h2 style="margin: 0">Recent registrations</h2>
            <div class="admin-actions">
              <button class="btn ghost" type="button" data-clear-registrations>
                Clear test data
              </button>
              <button class="btn ghost" type="button" data-export-registrations>
                Export CSV
              </button>
            </div>
          </div>

          <div class="card admin-filters">
            <div class="field">
              <label for="registration_search">Search</label>
              <input
                id="registration_search"
                type="search"
                placeholder="Name, phone, Instagram, or city"
                data-registration-search
              />
            </div>
            <div class="field">
              <label for="distance_filter">Distance</label>
              <select id="distance_filter" data-distance-filter>
                <option value="">All distances</option>
                <option>3KM</option>
                <option>5KM</option>
                <option>10KM</option>
              </select>
            </div>
            <div class="field">
              <label for="first_time_filter">First time</label>
              <select id="first_time_filter" data-first-time-filter>
                <option value="">All runners</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
          </div>

          <div class="card table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Instagram</th>
                  <th>Gender</th>
                  <th>Age</th>
                  <th>Distance</th>
                  <th>Frequency</th>
                  <th>Transport</th>
                  <th>From</th>
                  <th>Referrer</th>
                  <th>First time</th>
                </tr>
              </thead>
              <tbody data-registrations-table>
                <tr>
                  <td colspan="12" class="muted">
                    No registrations saved in this browser yet.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script src="../assets/site.js"></script>
  </body>
</html>
